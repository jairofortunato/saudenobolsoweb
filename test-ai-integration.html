<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Integração AI Processor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f8fafc;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
        }
        .success {
            background: #dcfce7;
            border: 1px solid #22c55e;
            color: #15803d;
        }
        .error {
            background: #fef2f2;
            border: 1px solid #ef4444;
            color: #dc2626;
        }
        .processing {
            background: #dbeafe;
            border: 1px solid #3b82f6;
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Teste Integração AI Processor</h1>
        <p>Teste a integração entre o web app e o processador de IA médica.</p>

        <div>
            <label for="medicalText">Texto Médico:</label>
            <textarea 
                id="medicalText" 
                placeholder="Digite informações médicas aqui... 
Exemplo: Tenho alergia a dipirona, me causa urticária"
            >Tenho alergia a dipirona, me causa urticária</textarea>
        </div>

        <button onclick="testAIProcessor()" id="testBtn">
            🚀 Testar AI Processor
        </button>

        <div id="result"></div>
    </div>

    <script>
        async function testAIProcessor() {
            const textArea = document.getElementById('medicalText');
            const button = document.getElementById('testBtn');
            const resultDiv = document.getElementById('result');
            
            const text = textArea.value.trim();
            if (!text) {
                resultDiv.innerHTML = '<div class="error">❌ Por favor, insira algum texto médico.</div>';
                return;
            }

            // Update UI
            button.disabled = true;
            button.textContent = '🤖 Processando com IA...';
            resultDiv.innerHTML = '<div class="processing">🔍 Analisando texto médico com IA multi-agente...</div>';

            try {
                const response = await fetch('http://localhost:8000/api/ai/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        category: null,
                        submitDirectly: true,
                        submit_directly: true
                    })
                });

                const result = await response.json();
                
                console.log('AI Processor Response:', result);

                let resultHTML = '';

                if (result.success) {
                    // Full success
                    resultHTML = `
                        <div class="success">
                            ✅ <strong>Sucesso Total!</strong><br>
                            📊 Entradas criadas: ${result.data?.entries_created || 0}<br>
                            📁 Categorias: ${result.data?.categories?.join(', ') || 'N/A'}<br>
                            💾 Armazenado no banco: ${result.data?.stored_to_database ? 'Sim' : 'Não'}
                        </div>
                    `;
                } else if (result.data && (result.data.classification || result.data.extractions)) {
                    // Partial success - AI worked, database failed
                    const classification = result.data.classification;
                    const extractions = result.data.extractions;
                    
                    resultHTML = `
                        <div class="success">
                            🤖 <strong>IA Processou com Sucesso!</strong><br>
                            (Dados não salvos temporariamente - problema de BD)<br><br>
                    `;

                    if (classification) {
                        const confidence = Math.round(classification.overall_confidence * 100);
                        const categories = classification.categories?.map(cat => cat.category) || [];
                        
                        resultHTML += `
                            🎯 <strong>Classificação:</strong><br>
                            • Categorias encontradas: ${categories.join(', ')}<br>
                            • Confiança geral: ${confidence}%<br>
                            • Categoria principal: ${classification.primary_category}<br><br>
                        `;
                    }

                    if (extractions) {
                        resultHTML += `🔬 <strong>Dados Extraídos:</strong><br>`;
                        
                        Object.keys(extractions).forEach(category => {
                            const items = extractions[category]?.items || [];
                            const confidence = extractions[category]?.extraction_confidence || 0;
                            
                            resultHTML += `
                                • <strong>${category.toUpperCase()}:</strong> ${items.length} item(s) 
                                (${Math.round(confidence * 100)}% confiança)<br>
                            `;
                            
                            items.forEach((item, index) => {
                                resultHTML += `  ${index + 1}. ${item.name || 'Item desconhecido'}<br>`;
                            });
                        });
                    }

                    resultHTML += '</div>';
                } else {
                    // Complete failure
                    resultHTML = `
                        <div class="error">
                            ❌ <strong>Erro:</strong><br>
                            ${result.error || 'Falha desconhecida no processamento'}
                        </div>
                    `;
                }

                resultDiv.innerHTML = resultHTML;

            } catch (error) {
                console.error('Erro:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        ❌ <strong>Erro de Conexão:</strong><br>
                        ${error.message}<br><br>
                        Verifique se o AI Processor está rodando em localhost:8000
                    </div>
                `;
            } finally {
                button.disabled = false;
                button.textContent = '🚀 Testar AI Processor';
            }
        }

        // Test on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Página de teste carregada. Pronto para testar a integração!');
        });
    </script>
</body>
</html>
